name: termux-release-checkpoint

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Release branch to checkpoint from, for example release/0.123.0"
        required: false
        type: string
        default: ""
      source_sha:
        description: "Specific source commit SHA to checkpoint; defaults to the source branch tip"
        required: false
        type: string
        default: ""
      destination_branch:
        description: "Destination patch branch to receive the checkpoint PR"
        required: false
        type: string
        default: "wallentx/termux-target"
      reviewer:
        description: "GitHub username to request as reviewer"
        required: false
        type: string
        default: "wallentx"

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  statuses: read

concurrency:
  group: termux-release-checkpoint-${{ inputs.source_branch || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  checkpoint:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      DESTINATION_BRANCH: ${{ inputs.destination_branch || 'wallentx/termux-target' }}
      REVIEWER: ${{ inputs.reviewer || 'wallentx' }}
      REQUESTED_SOURCE_BRANCH: ${{ inputs.source_branch }}
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      TERMUX_AUTOMATION_DIR: ${{ github.workspace }}/.termux-release-automation
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Export GitHub App token for gh
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_TOKEN=${APP_TOKEN}" >> "${GITHUB_ENV}"

      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout automation helpers
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.workflow_sha }}
          path: .termux-release-automation
          token: ${{ steps.app-token.outputs.token }}

      - name: 🧰 Actions Toolbox
        uses: wallentx/gh-actions/composite/actions-toolbox@main

      - name: Validate GitHub CLI environment
        run: bash "${TERMUX_AUTOMATION_DIR}/scripts/termux-validate-gh-env.sh"

      - name: Configure git
        run: |
          set -euo pipefail
          source_branch="${REQUESTED_SOURCE_BRANCH:-${GITHUB_REF_NAME}}"
          bash "${TERMUX_AUTOMATION_DIR}/scripts/termux-configure-git.sh" --origin "${DESTINATION_BRANCH}" "${source_branch}"

      - name: Create checkpoint PR
        run: bash "${TERMUX_AUTOMATION_DIR}/scripts/termux-create-checkpoint-pr.sh"
