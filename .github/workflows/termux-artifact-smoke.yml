name: termux-artifact-smoke

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the Actions artifact to download from artifact_run_id.
        required: false
        type: string
        default: ""
      artifact_run_id:
        description: Workflow run id containing artifact_name. Required when artifact_name is set.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing codex-aarch64-linux-android.tar.gz.
        required: false
        type: string
        default: ""
      artifact_url:
        description: GitHub Actions artifact URL from a rust-release run summary.
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  reusable-smoke:
    name: Termux Reusable Smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && inputs.artifact_url == '' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        jq
      copy-paths: |
        .github/workflows/termux-artifact-smoke.yml
        scripts/termux-release-paths.sh
      env: |
        TERMUX_REUSABLE_SMOKE=codex-termux
        CALLER_REPOSITORY=${{ github.repository }}
        CALLER_REF=${{ github.ref_name }}
      commands: |
        set -Eeuo pipefail

        test "$TERMUX_REUSABLE_SMOKE" = "codex-termux"
        test "$CALLER_REPOSITORY" = "wallentx/codex-termux"
        command -v bash
        command -v pacman
        command -v jq
        pacman -Q jq
        test -f .github/workflows/termux-artifact-smoke.yml
        test -f scripts/termux-release-paths.sh

        mkdir -p termux-reusable-output
        {
          printf 'termux reusable smoke ok\n'
          printf 'repository=%s\n' "$CALLER_REPOSITORY"
          printf 'ref=%s\n' "$CALLER_REF"
          printf 'arch=%s\n' "$(uname -m)"
          jq --version
        } > termux-reusable-output/result.txt
      sync-back-paths: |
        termux-reusable-output/result.txt
      upload-artifact-name: termux-reusable-smoke-${{ github.run_id }}

  smoke:
    name: Smoke Codex in Termux
    # Reusable workflows retain the caller's event name, so detect workflow_call
    # invocations by the artifact input supplied by rust-release.yml.
    if: ${{ inputs.artifact_name != '' || inputs.release_tag != '' || inputs.artifact_url != '' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    secrets:
      github-token: ${{ github.token }}
    with:
      packages: |
        ca-certificates
        libc++
        tar
        zstd
      copy-paths: |
        termux-smoke-artifact
      env: |
        ARTIFACT_NAME=${{ inputs.artifact_name || '' }}
        ARTIFACT_RUN_ID=${{ inputs.artifact_run_id || '' }}
        ARTIFACT_URL=${{ inputs.artifact_url || '' }}
        DOWNLOAD_DIR=termux-smoke-artifact
        RELEASE_TAG=${{ inputs.release_tag || '' }}
      host-commands: |
        set -Eeuo pipefail

        bash .github/scripts/termux-download-codex-artifact.sh
      commands: |
        set -Eeuo pipefail

        archive="$(
          find termux-smoke-artifact -type f -name 'codex-aarch64-linux-android.tar.gz' -print -quit
        )"
        if [[ -z "$archive" ]]; then
          archive="$(
            find termux-smoke-artifact -type f -name 'codex-package-aarch64-linux-android.tar.gz' -print -quit
          )"
        fi
        if [[ -z "$archive" ]]; then
          archive="$(
            find termux-smoke-artifact -type f -name '*aarch64-linux-android*.tar.gz' -print -quit
          )"
        fi
        if [[ -z "$archive" ]]; then
          echo "Could not find an aarch64-linux-android .tar.gz artifact in termux-smoke-artifact." >&2
          find termux-smoke-artifact -maxdepth 4 -type f -print >&2
          exit 1
        fi

        rm -rf codex-smoke
        mkdir -p codex-smoke
        tar -xzf "$archive" -C codex-smoke
        find codex-smoke -maxdepth 3 -type f -print

        codex=""
        for candidate in \
          codex-smoke/codex \
          codex-smoke/bin/codex \
          codex-smoke/codex-aarch64-linux-android
        do
          if [[ -x "$candidate" ]]; then
            codex="$candidate"
            break
          fi
        done

        if [[ -z "$codex" ]]; then
          echo "Could not find executable codex in $archive." >&2
          exit 1
        fi

        code_mode_host=""
        for candidate in \
          codex-smoke/codex-code-mode-host \
          codex-smoke/bin/codex-code-mode-host
        do
          if [[ -x "$candidate" ]]; then
            code_mode_host="$candidate"
            break
          fi
        done

        if [[ -z "$code_mode_host" ]]; then
          echo "Could not find executable codex-code-mode-host in $archive." >&2
          exit 1
        fi

        export CODEX_HOME="$PWD/codex-home"
        export RUST_BACKTRACE=1
        mkdir -p "$CODEX_HOME"

        "$codex" --version
        "$codex" --help | tee codex-help.txt
        grep -Eiq 'codex' codex-help.txt
        grep -Eiq 'usage' codex-help.txt
        "$codex" exec --help | tee codex-exec-help.txt
        grep -Eiq 'exec' codex-exec-help.txt
        grep -Eiq 'usage' codex-exec-help.txt
        "$code_mode_host" --help | tee codex-code-mode-host-help.txt
        grep -Eiq 'usage' codex-code-mode-host-help.txt
