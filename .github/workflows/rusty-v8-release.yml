name: rusty-v8-release

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository containing the Codex source tree to build.
        required: false
        default: openai/codex
        type: string
      release_ref:
        description: Branch, tag, or SHA containing the Codex source tree to build.
        required: true
        type: string
      release_tag:
        description: Optional release tag. Defaults to rusty-v8-v<resolved_v8_version>.
        required: false
        type: string
      android_artifact_repository:
        description: Repository containing Android rusty_v8 release artifacts.
        required: false
        default: wallentx/rusty_v8
        type: string
      android_artifact_tag:
        description: Optional Android rusty_v8 release tag. Defaults to v<resolved_v8_version>.
        required: false
        type: string
      publish:
        description: Publish the staged Android artifacts to a GitHub release.
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}::${{ inputs.source_repository }}::${{ inputs.release_tag || inputs.release_ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      v8_version: ${{ steps.v8_version.outputs.version }}

    steps:
      - name: Check out source ref
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.release_ref }}
          path: source

      - name: Check out workflow tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          path: workflow

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve exact v8 crate version
        id: v8_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 workflow/.github/scripts/rusty_v8_android_release.py resolved-v8-crate-version --repo-root source)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release_tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          V8_VERSION: ${{ steps.v8_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${RELEASE_TAG_INPUT}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="rusty-v8-v${V8_VERSION}"
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

  stage-android:
    name: Stage aarch64-linux-android
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download Android release pair
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_ARTIFACT_REPOSITORY: ${{ inputs.android_artifact_repository }}
          ANDROID_ARTIFACT_TAG_INPUT: ${{ inputs.android_artifact_tag }}
          TARGET: aarch64-linux-android
          V8_VERSION: ${{ needs.metadata.outputs.v8_version }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_tag="${ANDROID_ARTIFACT_TAG_INPUT}"
          if [[ -z "${artifact_tag}" ]]; then
            artifact_tag="v${V8_VERSION}"
          fi

          output_dir="dist/${TARGET}"
          mkdir -p "${output_dir}"

          echo "Downloading Android rusty_v8 artifacts from ${ANDROID_ARTIFACT_REPOSITORY}@${artifact_tag}"
          gh release download "${artifact_tag}" \
            --repo "${ANDROID_ARTIFACT_REPOSITORY}" \
            --dir "${output_dir}" \
            --pattern "librusty_v8_release_${TARGET}.a.gz" \
            --pattern "src_binding_release_${TARGET}.rs"

          test -s "${output_dir}/librusty_v8_release_${TARGET}.a.gz"
          test -s "${output_dir}/src_binding_release_${TARGET}.rs"

      - name: Upload staged Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rusty-v8-${{ needs.metadata.outputs.v8_version }}-aarch64-linux-android
          path: dist/aarch64-linux-android/*

  publish-release:
    if: ${{ inputs.publish }}
    needs:
      - metadata
      - stage-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Publish Android artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: ${{ needs.metadata.outputs.release_tag }}
          files: dist/**
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: true
